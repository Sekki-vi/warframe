<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORDIS // Market Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/warframe.css') }}">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="status-dot" aria-hidden="true"></div>
        <h1>ORDIS <span class="divider">//</span> MARKET INTERFACE</h1>
        <button type="button"
                id="clear-btn"
                class="btn-secondary"
                title="Clear conversation">RESET</button>
      </div>
      <p class="subtitle">Warframe Market knowledge terminal — RAG-assisted queries</p>
    </header>

    <main class="chat-panel">
      <div id="messages" class="messages" role="log" aria-live="polite">
        <div class="message ordis">
          <div class="message-label">ORDIS</div>
          <div class="message-body">
            Operator, the market interface is online. I can provide item descriptions,
            statistics, and historical price aggregates from the indexed corpus.
            How may I assist you?
          </div>
        </div>
      </div>

      <div class="prompt-chips" id="prompt-chips">
        <button type="button" class="chip" data-prompt="What is Primed Flow and what is the typical price?">Primed Flow</button>
        <button type="button" class="chip" data-prompt="How much is Nova Prime Set?">Nova Prime Set</button>
        <button type="button" class="chip" data-prompt="Tell me about Arcane Energize">Arcane Energize</button>
      </div>

      <form id="chat-form" class="input-row">
        <input type="text"
               id="message-input"
               placeholder="Transmit your query, Operator..."
               autocomplete="off"
               required>
        <button type="submit" id="send-btn" class="btn-primary">TRANSMIT</button>
      </form>
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
